{% extends "base.html" %}
{% block title %}Papers · Paper Pipeline{% endblock %}
{% block content %}
{% if no_library %}
  <section class="state-panel compact no-library-state" role="status">
    <h2>No library is open</h2>
    <p>Open a library to view papers.</p>
  </section>
{% else %}
  <form id="paper-filters" class="filters" aria-label="Paper filters">
    <input id="paper-sort" type="hidden" name="sort" value="{{ filters.sort }}">
    <input id="paper-direction" type="hidden" name="direction" value="{{ filters.direction }}">
    <label class="search-field">
      <span>Search</span>
      <input id="paper-query" type="search" name="q" placeholder="Title, author, or citekey"
             hx-get="/papers/table" hx-trigger="input changed delay:250ms, search"
             hx-include="#paper-filters" hx-target="#paper-results">
    </label>
    <label>
      <span>Conversion</span>
      <select name="conversion" hx-get="/papers/table" hx-trigger="change"
              hx-include="#paper-filters" hx-target="#paper-results">
        <option value="all">All states</option>
        <option value="pending">Pending</option>
        <option value="ready">Ready</option>
        <option value="failed">Failed</option>
      </select>
    </label>
    <label>
      <span>Summary</span>
      <select name="recipe" hx-get="/papers/table" hx-trigger="change"
              hx-include="#paper-filters" hx-target="#paper-results">
        <option value="all">All states</option>
        <option value="pending">Pending</option>
        <option value="ready">Ready</option>
        <option value="failed">Failed</option>
      </select>
    </label>
  </form>
  <div id="paper-results">
    {% include "_papers_table.html" %}
  </div>
{% endif %}
{% endblock %}
